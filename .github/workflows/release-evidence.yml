name: Release validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-reset:
    name: Release artifact and installation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify reviewed website telemetry runtime
        run: make telemetry-check

      - name: Validate release source and synchronized packages
        run: make validate

      - name: Verify package isolation and setup rollback
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest
          tests.test_portable_plugin tests.test_setup_rootloom

      - name: Match release tag to plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          version = json.loads(Path("plugins/rootloom/.codex-plugin/plugin.json").read_text())["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "release tag/version mismatch"
          PYTHON
