name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select impact scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      primary-mode: ${{ steps.impact.outputs.primary-mode }}
      python-edge: ${{ steps.impact.outputs.python-edge }}
      portable: ${{ steps.impact.outputs.portable }}
      codex: ${{ steps.impact.outputs.codex }}
      full-matrix: ${{ steps.impact.outputs.full-matrix }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select checks from changed paths
        id: impact
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMPACT_CANONICAL_FULL: ${{ github.event_name != 'pull_request' }}
          IMPACT_FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: >-
          python scripts/impact_tests.py select
          --base "$IMPACT_BASE_SHA"
          --head "$GITHUB_SHA"
          --canonical-full "$IMPACT_CANONICAL_FULL"
          --full-matrix "$IMPACT_FULL_MATRIX"
          --github-output "$GITHUB_OUTPUT"

  primary:
    name: Primary contracts (Python 3.11)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run primary impact checks
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMPACT_CANONICAL_FULL: ${{ needs.scope.outputs.primary-mode == 'full' }}
        run: >-
          python scripts/impact_tests.py run
          --base "$IMPACT_BASE_SHA"
          --head "$GITHUB_SHA"
          --lane primary
          --canonical-full "$IMPACT_CANONICAL_FULL"

  python-edge:
    name: Runtime compatibility (Python 3.14)
    needs: scope
    if: needs.scope.outputs.python-edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Run affected runtime compatibility cases
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python scripts/impact_tests.py run
          --base "$IMPACT_BASE_SHA"
          --head "$GITHUB_SHA"
          --lane compatibility

  full-python-matrix:
    name: Scheduled full suite (Python ${{ matrix.python-version }})
    needs: scope
    if: needs.scope.outputs.full-matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the full unit suite
        run: make test

  portable-platforms:
    name: Portable impact (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.portable == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run affected portable contracts
        shell: bash
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          IMPACT_FULL_MATRIX: ${{ needs.scope.outputs.full-matrix }}
        run: >-
          python scripts/impact_tests.py run
          --base "$IMPACT_BASE_SHA"
          --head "$GITHUB_SHA"
          --lane portable
          --full-matrix "$IMPACT_FULL_MATRIX"

  codex-contracts:
    name: Codex CLI contracts
    needs: scope
    if: needs.scope.outputs.codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.147.0

      - name: Run offline native plugin compatibility smoke
        run: make compatibility-smoke

      - name: Run offline portable plugin compatibility smoke
        run: make portable-compatibility-smoke

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - scope
      - primary
      - python-edge
      - full-python-matrix
      - portable-platforms
      - codex-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every executed job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          # Conditional jobs may be skipped by the impact scope; failures and cancellations are not allowed.
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
          # scope and primary always run, so they must have succeeded.
          [ "${{ needs.scope.result }}" = "success" ] && [ "${{ needs.primary.result }}" = "success" ]
