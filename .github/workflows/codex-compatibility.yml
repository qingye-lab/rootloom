name: Codex compatibility probe

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-cli:
    name: Latest Codex CLI (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest

      - name: Record probed version
        run: codex --version

      - name: Validate repository structure
        run: make validate

      - name: Run offline native plugin compatibility smoke
        run: make compatibility-smoke

      - name: Run offline portable plugin compatibility smoke
        run: make portable-compatibility-smoke
